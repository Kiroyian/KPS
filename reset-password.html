<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karero Comprehensive School - Reset Password</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-box reset-box">
            <h1>Reset Password</h1>
            <p class="reset-help">Enter your email and choose a new password.</p>

            <form id="resetPasswordForm" class="auth-form">
                <div class="input-group">
                    <input type="email" id="resetEmail" placeholder="Email" required>
                </div>
                <div class="input-group password-box">
                    <input type="password" id="newPassword" placeholder="New password" minlength="6" required>
                    <span class="toggle-password" onclick="togglePassword('newPassword')">&#128065;</span>
                </div>
                <div class="input-group password-box">
                    <input type="password" id="confirmPassword" placeholder="Confirm password" minlength="6" required>
                    <span class="toggle-password" onclick="togglePassword('confirmPassword')">&#128065;</span>
                </div>
                <p class="form-message" id="resetMessage" aria-live="polite"></p>
                <button type="submit" class="auth-btn">Reset Password</button>
            </form>

            <p class="back-link">
                <a href="registration.html">Back to login</a>
            </p>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('resetMessage');

            if (newPassword !== confirmPassword) {
                message.textContent = 'Passwords do not match.';
                message.className = 'form-message error';
                return;
            }

            message.textContent = 'Password reset request submitted.';
            message.className = 'form-message success';
            event.target.reset();
        });
    </script>
</body>
</html>
